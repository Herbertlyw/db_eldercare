  <title>图 16　设备告警、人工求助与现场处置</title>
  <desc>现场经办人是获授权的社区管理员或责任护工。误报仅由社区管理员关闭。定时检查独立运行，已响应事件继续跟进入户和结案。升到二级后限时 180 秒，升到三级后限时 60 秒。</desc>
