<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="1015" viewBox="0 0 1000 1015"><title id="title">图 16　设备告警、人工求助与现场处置</title><desc id="desc">异常采样建立待核实事件时即通知相关人员。核实后可继续处理，工作人员也可直接响应。仅社区管理员可将误报关闭。人工上报不需要先有订单。升到二级后限时 180 秒，升到三级后限时 60 秒，已响应事件只跟进到场和结案。</desc>
<defs><marker id="forward" markerWidth="8" markerHeight="8" refX="7.1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#354953"/></marker><marker id="branch" markerWidth="8" markerHeight="8" refX="7.1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#926a4e"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;fill:#1e3038}</style>
<rect width="1000" height="1015" fill="white"/>
<rect x="20" y="5" width="240" height="1005" fill="#f7f9fa"/>
<path d="M20 5 V1010" stroke="#d5dfe3" stroke-width="1.3"/>
<rect x="20" y="5" width="240" height="49" fill="#e7eef0"/>
<text x="140" y="37" style="font-size:23px;font-weight:600">家属或护工</text>
