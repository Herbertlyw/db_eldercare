<text x="380" y="37" style="font-size:23px;font-weight:600">社区管理员</text>
<rect x="500" y="5" width="240" height="1005" fill="#f7f9fa"/>
<path d="M500 5 V1010" stroke="#d5dfe3" stroke-width="1.3"/>
<rect x="500" y="5" width="240" height="49" fill="#e7eef0"/>
<text x="620" y="37" style="font-size:23px;font-weight:600">平台</text>
<rect x="740" y="5" width="240" height="1005" fill="#ffffff"/>
<path d="M740 5 V1010" stroke="#d5dfe3" stroke-width="1.3"/>
<rect x="740" y="5" width="240" height="49" fill="#e7eef0"/>
<text x="860" y="37" style="font-size:21px;font-weight:600">社区管理员或责任护工</text>
<path d="M980 5 V1010 H20 M20 55 H980" fill="none" stroke="#c2d0d5"/>
<polyline points="380,139 380,203 513,203" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>登记并绑定设备设置监测指标 → 定时模拟采样或接收批量上传</title></polyline>
<polyline points="620,233 620,267" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>定时模拟采样或接收批量上传 → 范围内：保存体征</title></polyline>
<polyline points="727,203 735,203 735,391 727,391" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>定时模拟采样或接收批量上传 → 越界：创建待核实事件</title></polyline>
<polyline points="620,421 620,455" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>越界：创建待核实事件 → 记录截止时间发送站内通知</title></polyline>
<polyline points="727,485 735,485 735,767 753,767" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>记录截止时间发送站内通知 → 登记首次响应</title></polyline>
<polyline points="860,797 860,831" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>登记首次响应 → 记录到场时间</title></polyline>
<polyline points="860,891 860,925" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>记录到场时间 → 填处置结果并结案</title></polyline>
<polyline points="620,515 620,579 753,579" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>记录截止时间发送站内通知 → 核实设备告警</title></polyline>
<polyline points="860,609 860,737" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>核实设备告警 → 登记首次响应</title></polyline>
<polyline points="860,609 860,617 380,617 380,643" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>核实设备告警 → 误报：说明原因终止处置</title></polyline>
<polyline points="140,327 140,485 513,485" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>家属呼叫或护工上报异常、隐患 → 记录截止时间发送站内通知</title></polyline>
<polyline points="620,515 620,643" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>记录截止时间发送站内通知 → 未响应且超时升级并再次通知</title></polyline>
<polyline points="727,673 745,673 745,767 753,767" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>未响应且超时升级并再次通知 → 登记首次响应</title></polyline>
