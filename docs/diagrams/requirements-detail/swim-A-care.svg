<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="921" viewBox="0 0 1000 921"><title id="title">图 12　从建档到照护计划及复评</title><desc id="desc">家属账号可以在建档后再关联。换址或迁移沿用原档案号。复评另存记录，新的评估生效后，原评估下仍在执行的计划暂停。</desc>
