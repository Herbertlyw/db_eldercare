  <title>图 15　从招聘、排班到核定有效工时</title>
  <desc>已有班次可服务多笔订单。两次打卡均在围栏内、签到不早于预约前 30 分钟、签退不晚于预约后 30 分钟且时长达到 80%，才自动计为有效。零分钟不能复核为有效。</desc>
