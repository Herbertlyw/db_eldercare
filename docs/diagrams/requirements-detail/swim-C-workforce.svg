<rect x="698" y="79" width="244" height="60" rx="5" fill="#fff7ee" stroke="#b89573" stroke-width="1.6"/>
<text x="820" y="104.76" style="font-size:22px;font-weight:400">未录用</text>
<text x="820" y="127.76" style="font-size:22px;font-weight:400">保留审核记录</text>
<rect x="698" y="173" width="244" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="820" y="198.76" style="font-size:22px;font-weight:400">录用后建立账号、档案</text>
<text x="820" y="221.76" style="font-size:22px;font-weight:400">及默认服务区域</text>
