<text x="180" y="315.76" style="font-size:22px;font-weight:400">项目证书及有效期</text>
<rect x="58" y="361" width="244" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="180" y="386.76" style="font-size:22px;font-weight:400">维护在岗状态、区域</text>
<text x="180" y="409.76" style="font-size:22px;font-weight:400">发布班次与名额</text>
<rect x="698" y="455" width="244" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="820" y="480.76" style="font-size:22px;font-weight:400">核对人员资格、班次</text>
<text x="820" y="503.76" style="font-size:22px;font-weight:400">容量与时间冲突</text>
<rect x="378" y="549" width="244" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="500" y="574.76" style="font-size:22px;font-weight:400">查看班次、接单上门</text>
<text x="500" y="597.76" style="font-size:22px;font-weight:400">完成两次打卡</text>
<rect x="698" y="643" width="244" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="820" y="668.76" style="font-size:22px;font-weight:400">按围栏、预约时间窗</text>
<text x="820" y="691.76" style="font-size:22px;font-weight:400">和实际时长认定</text>
<rect x="58" y="737" width="244" height="60" rx="5" fill="#fff7ee" stroke="#b89573" stroke-width="1.6"/>
<text x="180" y="762.76" style="font-size:22px;font-weight:400">异常工时复核</text>
<text x="180" y="785.76" style="font-size:22px;font-weight:400">填理由、判有效或无效</text>
<rect x="698" y="831" width="244" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="820" y="856.76" style="font-size:22px;font-weight:400">按签到月份</text>
<text x="820" y="879.76" style="font-size:22px;font-weight:400">加总有效分钟</text>
<rect x="378" y="831" width="244" height="60" rx="17" fill="#e8f1ed" stroke="#779488" stroke-width="1.6"/>
<text x="500" y="856.76" style="font-size:22px;font-weight:400">查明细、月工时</text>
