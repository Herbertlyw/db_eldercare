  <title>图 13　预约、调度、上门与确认</title>
  <desc>社区也可代下单。预约校验失败时提示原因。预约时段未过且等候超过 15 分钟的订单进入调度池。拒接或签到前按权限退回，均释放班次名额；需要改派时记录原因。</desc>
