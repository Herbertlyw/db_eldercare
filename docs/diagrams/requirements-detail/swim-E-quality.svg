  <title>图 18　服务抽查、整改复核与机构考核</title>
  <desc>抽查结案与机构月度考核分别办理。退回一份整改材料后，机构可另交一份，前次意见保留。公开结论隐去老人身份和病情，撤回公示须记原因。</desc>
