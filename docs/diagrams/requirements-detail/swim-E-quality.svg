<text x="140" y="127.76" style="font-size:22px;font-weight:400">抽订单或护工</text>
<rect x="273" y="173" width="214" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="380" y="198.76" style="font-size:22px;font-weight:400">保留抽查总体</text>
<text x="380" y="221.76" style="font-size:22px;font-weight:400">及选中的样本</text>
<rect x="33" y="267" width="214" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="140" y="292.76" style="font-size:22px;font-weight:400">电话回访或上门核查</text>
<text x="140" y="315.76" style="font-size:22px;font-weight:400">登记评分和问题</text>
<rect x="513" y="361" width="214" height="60" rx="5" fill="#fff7ee" stroke="#b89573" stroke-width="1.6"/>
<text x="620" y="386.76" style="font-size:22px;font-weight:400">须整改：提交措施</text>
<text x="620" y="409.76" style="font-size:22px;font-weight:400">与证明材料</text>
<rect x="33" y="455" width="214" height="60" rx="5" fill="#fff7ee" stroke="#b89573" stroke-width="1.6"/>
<text x="140" y="492.26" style="font-size:22px;font-weight:400">复核整改材料</text>
<rect x="513" y="549" width="214" height="60" rx="5" fill="#fff7ee" stroke="#b89573" stroke-width="1.6"/>
<text x="620" y="574.76" style="font-size:22px;font-weight:400">被退回：按意见</text>
<text x="620" y="597.76" style="font-size:22px;font-weight:400">另交材料</text>
<rect x="273" y="643" width="214" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="380" y="668.76" style="font-size:22px;font-weight:400">无需整改或复核通过</text>
<text x="380" y="691.76" style="font-size:22px;font-weight:400">抽查结案</text>
<rect x="33" y="737" width="214" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="140" y="762.76" style="font-size:22px;font-weight:400">对已结案且有评分的</text>
<text x="140" y="785.76" style="font-size:22px;font-weight:400">抽查发布公示</text>
<rect x="753" y="737" width="214" height="60" rx="17" fill="#e8f1ed" stroke="#779488" stroke-width="1.6"/>
<text x="860" y="774.26" style="font-size:22px;font-weight:400">查看公开结论</text>
<rect x="513" y="831" width="214" height="60" rx="17" fill="#edf4f4" stroke="#809e9e" stroke-width="1.6"/>
<text x="620" y="867.6" style="font-size:20px;font-weight:400">按月提交机构考核材料</text>
<rect x="33" y="925" width="214" height="60" rx="17" fill="#e8f1ed" stroke="#779488" stroke-width="1.6"/>
<text x="140" y="950.76" style="font-size:22px;font-weight:400">审核材料</text>
<text x="140" y="973.76" style="font-size:22px;font-weight:400">记录采纳或退回意见</text>
</svg>
