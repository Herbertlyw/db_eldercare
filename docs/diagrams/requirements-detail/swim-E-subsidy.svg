<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="921" viewBox="0 0 1000 921"><title id="title">图 17　一份补贴申报的两级审核与拨付</title><desc id="desc">街道和民政只审核授权社区的申报。退回后从街道初审重新办理，原订单明细和历次意见保留。家庭自付按已完成订单扣除已拨补贴计算。</desc>
