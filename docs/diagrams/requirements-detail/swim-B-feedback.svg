<text x="380" y="37" style="font-size:23px;font-weight:600">社区管理员</text>
<rect x="500" y="5" width="240" height="723" fill="#f7f9fa"/>
<path d="M500 5 V728" stroke="#d5dfe3" stroke-width="1.3"/>
<rect x="500" y="5" width="240" height="49" fill="#e7eef0"/>
<text x="620" y="37" style="font-size:23px;font-weight:600">机构负责人</text>
<rect x="740" y="5" width="240" height="723" fill="#ffffff"/>
<path d="M740 5 V728" stroke="#d5dfe3" stroke-width="1.3"/>
<rect x="740" y="5" width="240" height="49" fill="#e7eef0"/>
<text x="860" y="37" style="font-size:23px;font-weight:600">平台</text>
<path d="M980 5 V728 H20 M20 55 H980" fill="none" stroke="#c2d0d5"/>
<polyline points="247,109 753,109" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>已完成服务给出评分 → 计入护工评价均分</title></polyline>
<polyline points="247,297 273,297" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>对一笔订单提交投诉 → 受理并决定承办方</title></polyline>
<polyline points="380,327 380,361" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>受理并决定承办方 → 社区承办核实并答复</title></polyline>
<polyline points="380,421 380,485 753,485" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>社区承办核实并答复 → 保存办理意见等候结案</title></polyline>
<polyline points="860,515 860,536 140,536 140,549" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>保存办理意见等候结案 → 家属确认结案</title></polyline>
<polyline points="140,609 140,673 753,673" fill="none" stroke="#354953" stroke-width="2" stroke-linejoin="round" marker-end="url(#forward)"><title>家属确认结案 → 记录结案人和时间保留历次意见</title></polyline>
<polyline points="487,297 620,297 620,361" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>受理并决定承办方 → 转给承办过该单的机构核实并答复</title></polyline>
<polyline points="727,391 860,391 860,455" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>转给承办过该单的机构核实并答复 → 保存办理意见等候结案</title></polyline>
<polyline points="753,485 745,485 745,579 487,579" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>保存办理意见等候结案 → 社区办理结案</title></polyline>
<polyline points="380,609 380,630 860,630 860,643" fill="none" stroke="#926a4e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#branch)"><title>社区办理结案 → 记录结案人和时间保留历次意见</title></polyline>
