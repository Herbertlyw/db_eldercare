<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="733" viewBox="0 0 1000 733"><title id="title">图 14　评价与投诉如何分别办理</title><desc id="desc">投诉可以在服务完成前提出。尚未派过单的投诉由社区承办。只有承办方答复后才能结案，投诉评分与普通服务评价分开统计。</desc>
<defs><marker id="forward" markerWidth="8" markerHeight="8" refX="7.1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#354953"/></marker><marker id="branch" markerWidth="8" markerHeight="8" refX="7.1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#926a4e"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;fill:#1e3038}</style>
<rect width="1000" height="733" fill="white"/>
<rect x="20" y="5" width="240" height="723" fill="#f7f9fa"/>
<path d="M20 5 V728" stroke="#d5dfe3" stroke-width="1.3"/>
<rect x="20" y="5" width="240" height="49" fill="#e7eef0"/>
<text x="140" y="37" style="font-size:23px;font-weight:600">老人及家属</text>
