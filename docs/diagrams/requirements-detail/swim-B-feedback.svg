<text x="860" y="503.76" style="font-size:22px;font-weight:400">等候结案</text>
<rect x="33" y="549" width="214" height="60" rx="5" fill="white" stroke="#90a4ad" stroke-width="1.6"/>
<text x="140" y="586.26" style="font-size:22px;font-weight:400">家属确认结案</text>
<rect x="273" y="549" width="214" height="60" rx="5" fill="#fff7ee" stroke="#b89573" stroke-width="1.6"/>
<text x="380" y="586.26" style="font-size:22px;font-weight:400">社区办理结案</text>
<rect x="753" y="643" width="214" height="60" rx="17" fill="#e8f1ed" stroke="#779488" stroke-width="1.6"/>
<text x="860" y="668.76" style="font-size:22px;font-weight:400">记录结案人和时间</text>
<text x="860" y="691.76" style="font-size:22px;font-weight:400">保留历次意见</text>
