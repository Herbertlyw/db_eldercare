order:1px solid #e5e6eb;border-radius:7px;color:#1d2129}.thumb:hover{border-color:#165dff}.thumb img{width:100%;display:block;aspect-ratio:1.5625;object-fit:contain;background:#fafafa;border-bottom:1px solid #f2f3f5}.thumb span{display:block;padding:12px 16px;font-weight:600}.document{max-width:1060px;background:white;margin:28px auto;padding:40px 56px;border:1px solid #e5e6eb;border-radius:8px;overflow-wrap:anywhere}.document h1{font-size:28px}.document h2{margin-top:38px;padding-top:12px;border-top:1px solid #e5e6eb;font-size:22px}.document h3{margin-top:24px;font-size:18px}.document code{background:#f2f3f5;border-radius:3px;padding:2px 5px;font-size:13px}.document table{border-collapse:collapse;width:100%;font-size:14px;margin:20px 0}.document th,.document td{padding:10px 12px;border:1px solid #e5e6eb;text-align:left;vertical-align:top}.document th{background:#f7f8fa}.document li{margin:8px 0}.table-wrap{overflow:auto}@media(max-width:800px){header>div{padding:18px 20px;align-items:flex-start;flex-direction:column}h1{font-size:20px}main{padding:20px 16px}.bar{align-items:flex-start;flex-direction:column}.tabs button{padding:7px 11px;font-size:14px}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.document{margin:16px;padding:24px 20px}.document th,.document td{min-width:130px}.document table{font-size:13px}}@media(max-width:440px){.overview{grid-template-columns:1fr}.controls{flex-wrap:wrap}}</style></head><body><header><div><div><h1>左邻右舍 · 工作台设计</h1><p>六种角色 · 桌面效果图 · 本地评审</p></div><nav><a href="index.html">页面预览</a><a href="plan.html">详细修改方案</a><a href="prompts.json">生图提示词</a></nav></div></header><main><div class="tabs" role="tablist" aria-label="选择角色"><button id="tab-0" role="tab" aria-selected="true" aria-controls="preview" tabindex="0" data-index="0">老人及家属</button><button id="tab-1" role="tab" aria-selected="false" aria-controls="preview" tabindex="-1" data-index="1">护工</button><button id="tab-2" role="tab" aria-selected="false" aria-controls="preview" tabindex="-1" data-index="2">社区管理员</button><button id="tab-3" role="tab" aria-selected="false" aria-controls="preview" tabindex="-1" data-index="3">机构负责人</button><button id="tab-4" role="tab" aria-selected="false" aria-controls="preview" tabindex="-1" data-index="4">街道审核</button><button id="tab-5" role="tab" aria-selected="false" aria-controls="preview" tabindex="-1" data-index="5">民政监管</button></div><section id="preview" role="tabpanel" aria-labelledby="tab-0"><div class="bar"><div><h2 id="title">老人及家属工作台</h2><p id="description">以当前老人为中心，安排预约、服务确认、照护记录和费用查询。</p></div><div class="controls"><button id="prev" aria-label="上一张">←</button><span id="count">1 / 6</span><button id="next" aria-label="下一张">→</button><button id="zoom" aria-pressed="false">原始尺寸</button><a id="original" href="01-family.png" target="_blank" rel="noopener">打开原图 ↗</a></div></div><div class="canvas" id="canvas"><img id="hero" src="01-family.png" alt="老人及家属工作台效果图"></div><p class="note">图片为生成的视觉方案，按钮不可操作；图中姓名与数值用于说明布局。业务规则、字段含义及实施范围以详细方案为准。</p></section><section class="overview" aria-label="全部页面"><button class="thumb" data-index="0" aria-label="查看老人及家属工作台"><img src="01-family.png" alt="老人及家属工作台布局缩略图" loading="lazy"><span>01　老人及家属工作台</span></button><button class="thumb" data-index="1" aria-label="查看护工工作台"><img src="02-caregiver-refined.png" alt="护工工作台布局缩略图" loading="lazy"><span>02　护工工作台</span></button><button class="thumb" data-index="2" aria-label="查看社区管理员工作台"><img src="03-admin.png" alt="社区管理员工作台布局缩略图" loading="lazy"><span>03　社区管理员工作台</span></button><button class="thumb" data-index="3" aria-label="查看机构负责人工作台"><img src="04-manager-refined.png" alt="机构负责人工作台布局缩略图" loading="lazy"><span>04　机构负责人工作台</span></button><button class="thumb" data-index="4" aria-label="查看街道审核工作台"><img src="05-street.png" alt="街道审核工作台布局缩略图" loading="lazy"><span>05　街道审核工作台</span></button><button class="thumb" data-index="5" aria-label="查看民政监管工作台"><img src="06-regulator.png" alt="民政监管工作台布局缩略图" loading="lazy"><span>06　民政监管工作台</span></button></section></main><script>const roles=[{"id": "01-family", "title": "老人及家属工作台", "image": "01-family.png", "description": "以当前老人为中心，安排预约、服务确认、照护记录和费用查询。"}, {"id": "02-caregiver", "title": "护工工作台", "image": "02-caregiver-refined.png", "description": "以当天服务顺序为中心，展示接单、签到、记录及个人班次。"}, {"id": "03-admin", "title": "社区管理员工作台", "image": "03-admin.png", "description": "先处理应急，再安排派单、复评、投诉及补贴材料。"}, {"id": "04-manager", "title": "机构负责人工作台", "image": "04-manager-refined.png", "description": "关注人员排班、证书培训、工时复核与机构整改。"}, {"id": "05-street", "title": "街道审核工作台", "image": "05-street.png", "description": "在同一视野内查看申报、核对依据、填写审核意见。"}, {"id": "06-regulator", "title": "民政监管工作台", "image": "06-regulator.png", "description": "按授权辖区查看统计、终审拨付、抽查与整改复核。"}];let selected=0;const el=id=>document.getElementById(id);function show(i,focus=false){selected=(i+roles.length)%roles.length;const r=roles[selected];el('title').textContent=r.title;el('description').textContent=r.description;el('hero').src=r.image;el('hero').alt=r.title+'效果图';el('original').href=r.image;el('count').textContent=(selected+1)+' / '+roles.length;el('preview').setAttribute('aria-labelledby','tab-'+selected);document.querySelectorAll('[role=tab]').forEach((t,j)=>{t.setAttribute('aria-selected',j===selected?'true':'false');t.tabIndex=j===selected?0:-1});if(focus)el('tab-'+selected).focus();history.replaceState(null,'','#'+r.id)}document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>{show(Number(b.dataset.index));if(b.classList.contains('thumb'))el('preview').scrollIntoView({behavior:'smooth',block:'start'})}));el('prev').onclick=()=>show(selected-1);el('next').onclick=()=>show(selected+1);el('zoom').onclick=()=>{const actual=el('canvas').classList.toggle('actual');el('zoom').textContent=actual?'适应宽度':'原始尺寸';el('zoom').setAttribute('aria-pressed',String(actual))};document.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();show(e.key==='Home'?0:e.key==='End'?roles.length-1:selected+(e.key==='ArrowLeft'?-1:1),true)}});const initial=roles.findIndex(r=>r.id===location.hash.slice(1));if(initial>=0)show(initial);</script></body></html>
