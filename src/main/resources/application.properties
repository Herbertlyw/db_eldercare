server.address=127.0.0.1
server.port=${PORT:18080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:33316/eldercare?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:elder_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jackson.time-zone=Asia/Shanghai
server.error.include-message=never
