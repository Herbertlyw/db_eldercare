<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183d34">
  <title>左邻右舍 · 社区养老服务</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login">
  <header class="login-header">
    <a class="wordmark" href="/" aria-label="左邻右舍首页">
      <span class="brand-mark" aria-hidden="true">邻</span>
      <span>左邻右舍<small>社区居家养老服务</small></span>
    </a>
  </header>

  <div class="login-layout">
    <div class="intro">
      <picture>
        <source srcset="care-neighborhood.webp" type="image/webp">
        <img class="neighborhood" src="neighborhood.svg" alt="" fetchpriority="high">
      </picture>
      <div class="intro-text">
        <h1>社区居家养老<br>服务工作台</h1>
        <p class="intro-copy">在这里管理老人档案、服务预约和日常照护记录。</p>
      </div>
    </div>

    <div class="login-panel">
      <form id="login-form">
        <h2>登录工作台</h2>
        <p class="form-description">使用已分配的账号进入工作台。</p>
        <label for="username">账号</label>
        <input id="username" name="username" autocomplete="username" placeholder="请输入账号" required>
        <label for="password">密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button id="show-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <p id="login-error" role="alert"></p>
        <button class="login-submit" type="submit">登录</button>
        <p class="account-help">账号有疑问？ <a href="mailto:2142354019@qq.com">联系管理员</a></p>
      </form>
      <div class="demo-note">
        <strong>课程演示</strong>
        <p>平台使用虚构数据。演示账号及密码见运行包内的账号说明。</p>
      </div>
    </div>
  </div>
</section>

<div id="workspace" hidden>
  <aside class="sidebar">
    <div class="wordmark">
      <span class="brand-mark" aria-hidden="true">邻</span>
      <span>左邻右舍<small>社区居家养老服务</small></span>
    </div>
    <div class="user-panel">
      <span class="user-avatar" aria-hidden="true">用</span>
      <div><strong id="role-name"></strong><p id="identity"></p></div>
    </div>
    <nav id="nav" aria-label="业务导航"></nav>
    <button id="logout" class="secondary logout-button">退出登录</button>
  </aside>

  <main>
    <div class="workspace-topline">
      <span>社区服务工作台</span>
      <span class="demo-label">演示环境</span>
    </div>
    <header class="page-header">
      <div><h1 id="title">老人档案</h1><p id="description"></p></div>
      <button id="refresh" class="secondary">刷新</button>
    </header>
    <section class="records" aria-label="业务记录">
      <div class="toolbar"><h2>档案列表</h2><span id="total"></span></div>
      <div class="table-wrap" tabindex="0" role="region" aria-label="业务记录表格，可横向滚动">
        <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      </div>
      <div class="pager">
        <span id="page"></span>
        <div><button id="prev" class="secondary">上一页</button><button id="next" class="secondary">下一页</button></div>
      </div>
    </section>
    <section class="operation">
      <div class="operation-heading"><h2>办理业务</h2><span>带 * 的项目为必填项</span></div>
      <label class="action-label" for="action">选择业务<select id="action"></select></label>
      <form id="action-form">
        <div id="fields"></div>
        <div class="form-footer">
          <button type="submit">确认提交</button>
          <p id="result" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
    <footer class="workspace-footer">左邻右舍 · 社区养老服务</footer>
  </main>
</div>
<script src="app.js"></script>
<script src="completion.js"></script>
</body>
</html>
