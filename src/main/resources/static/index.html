<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邻安社区养老服务平台</title><link rel="stylesheet" href="style.css"><body>
<section id="login"><div class="intro"><p class="eyebrow">社区居家养老智慧服务平台</p><h1>每一次服务<br>都有据可查。</h1><p>连接老人照护、护工服务与社区监管。</p><p class="note">课程演示环境 · 全部业务数据均为虚构</p></div><form id="login-form"><h2>登录工作台</h2><label>账号<input name="username" autocomplete="username" placeholder="例如 admin1" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="login-error" role="alert"></p><small>演示账号按角色区分：社区管理员、家属、护工、机构负责人、街道审核、民政监管。账号及密码见本地演示说明。</small></form></section>
<div id="workspace" hidden><aside><div class="brand">邻安 <span>养老服务</span></div><p id="identity"></p><nav id="nav"></nav><button id="logout" class="secondary">退出登录</button></aside><main><header><div><p class="eyebrow">社区服务工作台</p><h1 id="title">老人档案</h1></div><span class="tag">课程演示</span></header><p id="description"></p><div class="toolbar"><span id="total"></span><button id="refresh" class="secondary">刷新数据</button></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div><section class="operation"><h2>业务操作</h2><p>选择操作后填写信息。系统会校验权限、服务资格、时间范围和数据状态。</p><label>操作类型<select id="action"></select></label><form id="action-form"><div id="fields"></div><button>提交操作</button></form><p id="result" role="status"></p></section></main></div><script src="app.js"></script></body></html>
